name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  php:
    name: PHP validate + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, xmlwriter, zip
      - name: Composer validate
        run: |
          rm -f composer.lock
          composer validate --no-check-publish --strict
      - name: Install package dependencies
        run: composer update --no-interaction --prefer-dist
      - name: PHP syntax check
        run: |
          find src tests extend.php migrations -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  js:
    name: JS install + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install JS dependencies
        working-directory: js
        run: npm ci
      - name: Build forum assets
        working-directory: js
        run: npm run build
      - name: Verify tracked dist is reproducible
        run: git diff --exit-code -- js/dist/forum.js js/dist/forum.js.map
      - name: JS contract tests
        run: node --test js/tests/*.test.mjs

  flarum-install-smoke:
    name: Flarum 1.8.19 install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, xmlwriter, zip
      - name: Disposable Flarum 1.8.19 resolve/install/enable/disable
        run: bash scripts/disposable-flarum-smoke.sh

  mariadb-migrations:
    name: MariaDB prefix migration harness
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wiki_ctx
          MYSQL_USER: wiki
          MYSQL_PASSWORD: wiki
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: pdo, pdo_mysql
      - name: Install package dependencies
        run: |
          rm -f composer.lock
          composer update --no-interaction --prefer-dist
      - name: Migration harness PREFIX empty
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wiki_ctx
          DB_USERNAME: wiki
          DB_PASSWORD: wiki
          TABLE_PREFIX: ""
        run: bash scripts/mariadb-migration-harness.sh
      - name: Migration harness PREFIX flarum_
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wiki_ctx
          DB_USERNAME: wiki
          DB_PASSWORD: wiki
          TABLE_PREFIX: "flarum_"
        run: bash scripts/mariadb-migration-harness.sh
